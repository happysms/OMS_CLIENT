<!doctype html>
<html lang="ko"
    ><head
        ><meta charset="utf-8" /><meta
            name="viewport"
            content="width=device-width,initial-scale=1"
        /><title>로그인 · OMS Client</title>
        <style>
            html {
                color-scheme: dark;
                font-family: system-ui, sans-serif;
                background: #101518;
                color: #e8edef;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
            }
            .login {
                width: min(360px, calc(100vw - 72px));
                padding: 34px;
                background: #171e22;
                border: 1px solid #2a3338;
                border-radius: 10px;
            }
            .brand {
                color: #5bdfb7;
                font-size: 11px;
                letter-spacing: 2px;
            }
            h1 {
                font-size: 25px;
                margin: 16px 0 10px;
            }
            p {
                color: #94a7b1;
                font-size: 12px;
                line-height: 1.8;
            }
            label {
                display: block;
                font-size: 12px;
                color: #b8c9d1;
                margin: 23px 0 8px;
            }
            input,
            button {
                box-sizing: border-box;
                width: 100%;
                font: inherit;
                border-radius: 5px;
                padding: 12px;
            }
            input {
                background: #101518;
                border: 1px solid #3b4b53;
                color: #e8edef;
            }
            button {
                margin-top: 22px;
                background: #5bdfb7;
                color: #10382b;
                border: 0;
                cursor: pointer;
                font-weight: 700;
            }
            .error {
                color: #f0b1a4;
                background: #301f1d;
                padding: 10px;
                border-radius: 4px;
            }
            small {
                display: block;
                color: #728995;
                font-size: 10px;
                margin-top: 22px;
                line-height: 1.7;
            }
            input:focus-visible,
            button:focus-visible {
                outline: 2px solid #5bdfb7;
                outline-offset: 3px;
            }
        </style></head
    >
    <body
        ><main class="login"
            ><div class="brand">OMS CLIENT / SERVER</div><h1>분석 공간에 로그인</h1
            ><p>서버의 실제 호가 데이터로 조회하고,<br />나만의 조합을 분석합니다.</p> {% if error
            %}<p class="error" role="alert">{{ error }}</p>{% endif %}
            <form method="post" action="{{ action }}"
                ><input type="hidden" name="csrf_token" value="{{ csrf }}" /><label for="password"
                    >비밀번호</label
                ><input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                    autofocus
                /><button type="submit">로그인</button></form
            >
            <small>계정: admin · 비밀번호는 서버에서 설정합니다.</small></main
        ></body
    ></html
>
