<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" role="img" aria-labelledby="title description">
<title id="title">체결만 누적해 거래 활동을 계산</title>
<desc id="description">현행 모의 거래 집계。실제 체결만 입력 / 매수 2개 × 100원 = 200원 / 매도 1개 × 120원 = 120원 → 매수·매도 합계를 별도로 누적 / 대금 200 + 120 = 320원 / 수량 2 + 1 = 3개 → 보유량 1개와 거래량 3개는 다름 / 수수료는 별도 · 취소 잔량 제외 / USDT는 각 체결 당시 환율로 누적</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<rect width="1040" height="100%" rx="16" fill="#fff"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
<text font-size="14" fill="#64748b" font-weight="600"><tspan x="32" y="32">OMS SIMULATION  /  TRADE-ACTIVITY</tspan></text>
<text font-size="24" fill="#0f172a" font-weight="700"><tspan x="32" y="68">체결만 누적해 거래 활동을 계산</tspan></text>
<rect x="32" y="89" width="976" height="30" rx="7" fill="#f1f5f9"/>
<text font-size="15" fill="#334155" font-weight="600"><tspan x="46" y="110">현행 모의 거래 집계</tspan></text>
<rect x="32" y="132" width="312" height="246" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="32" y="132" width="312" height="5" rx="2" fill="#334155"/>
<text font-size="16" fill="#334155" font-weight="700"><tspan x="52" y="167">01  상황·입력</tspan></text>
<text font-size="19" fill="#1e293b" font-weight="400"><tspan x="52" y="204">실제 체결만 입력</tspan><tspan x="52" y="232">매수 2개 × 100원 = 200원</tspan><tspan x="52" y="260">매도 1개 × 120원 = 120원</tspan></text>
<path d="M347 255 L358 255" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="364" y="132" width="312" height="246" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="364" y="132" width="312" height="5" rx="2" fill="#334155"/>
<text font-size="16" fill="#334155" font-weight="700"><tspan x="384" y="167">02  판단·변화</tspan></text>
<text font-size="19" fill="#1e293b" font-weight="400"><tspan x="384" y="204">매수·매도 합계를 별도로 누적</tspan><tspan x="384" y="232">대금 200 + 120 = 320원</tspan><tspan x="384" y="260">수량 2 + 1 = 3개</tspan></text>
<path d="M679 255 L690 255" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="696" y="132" width="312" height="246" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="696" y="132" width="312" height="5" rx="2" fill="#334155"/>
<text font-size="16" fill="#334155" font-weight="700"><tspan x="716" y="167">03  결과·보존</tspan></text>
<text font-size="19" fill="#1e293b" font-weight="400"><tspan x="716" y="204">보유량 1개와 거래량 3개는 다</tspan><tspan x="716" y="232">름</tspan><tspan x="716" y="260">수수료는 별도 · 취소 잔량 제</tspan><tspan x="716" y="288">외</tspan><tspan x="716" y="316">USDT는 각 체결 당시 환율로</tspan><tspan x="716" y="344">누적</tspan></text>
<text font-size="15" fill="#475569" font-weight="400"><tspan x="32" y="416">왼쪽에서 오른쪽으로 읽습니다. 수치는 조건을 설명하는 합성 예시이며 거래 성과 예측이 아닙니다.</tspan><tspan x="32" y="440">현재 지원 상태와 세부 조건은 이 그림 아래의 본문·사례 대조표를 함께 확인하세요.</tspan></text>
</g></svg>
