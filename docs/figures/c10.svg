<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="544" viewBox="0 0 1040 544" role="img" aria-labelledby="title description">
<title id="title">C10 · 앞 물량+내 잔량보다 많은 tick</title>
<desc id="description">실행·차단 연결。앞 외부 100개 → 내 20개 / 반대 틱 130개 → 외부 100개 + 내 20개 소비 / 예산 10개 남음 → 내 전량 체결 / 남은 10개만 후순위로 전달</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<rect width="1040" height="100%" rx="16" fill="#fff"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
<text font-size="14" fill="#64748b" font-weight="600"><tspan x="32" y="32">OMS SIMULATION  /  C10</tspan></text>
<text font-size="24" fill="#0f172a" font-weight="700"><tspan x="32" y="68">C10 · 앞 물량+내 잔량보다 많은 tick</tspan></text>
<rect x="32" y="89" width="976" height="30" rx="7" fill="#ecfdf5"/>
<text font-size="15" fill="#0f766e" font-weight="600"><tspan x="46" y="110">실행·차단 연결</tspan></text>
<rect x="32" y="132" width="312" height="134" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="32" y="132" width="312" height="5" rx="2" fill="#0f766e"/>
<text font-size="16" fill="#0f766e" font-weight="700"><tspan x="52" y="167">01  상황·입력</tspan></text>
<text font-size="19" fill="#1e293b" font-weight="400"><tspan x="52" y="204">앞 외부 100개 → 내 20개</tspan><tspan x="52" y="232">반대 틱 130개</tspan></text>
<path d="M347 199 L358 199" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="364" y="132" width="312" height="134" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="364" y="132" width="312" height="5" rx="2" fill="#0f766e"/>
<text font-size="16" fill="#0f766e" font-weight="700"><tspan x="384" y="167">02  판단·변화</tspan></text>
<text font-size="19" fill="#1e293b" font-weight="400"><tspan x="384" y="204">외부 100개 + 내 20개 소비</tspan><tspan x="384" y="232">예산 10개 남음</tspan></text>
<path d="M679 199 L690 199" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="696" y="132" width="312" height="134" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="696" y="132" width="312" height="5" rx="2" fill="#0f766e"/>
<text font-size="16" fill="#0f766e" font-weight="700"><tspan x="716" y="167">03  결과·보존</tspan></text>
<text font-size="19" fill="#1e293b" font-weight="400"><tspan x="716" y="204">내 전량 체결</tspan><tspan x="716" y="232">남은 10개만 후순위로 전달</tspan></text>
<text font-size="17" fill="#0f172a" font-weight="600"><tspan x="32" y="304">수량 비교  ·  반대 틱 130개  ·  막대는 같은 축척</tspan></text>
<text font-size="16" fill="#334155" font-weight="600"><tspan x="32" y="347">처리 전</tspan></text>
<rect x="132.000" y="322" width="583.333" height="34" fill="#64748b" stroke="#fff"/>
<text font-size="16" fill="#fff" font-weight="600"><tspan x="140" y="346">100</tspan></text>
<rect x="715.333" y="322" width="116.667" height="34" fill="#2563eb" stroke="#fff"/>
<text font-size="16" fill="#fff" font-weight="600"><tspan x="723.333" y="346">20</tspan></text>
<text font-size="14" fill="#475569" font-weight="400"><tspan x="132" y="373">앞 외부 100 · 내 주문 20</tspan></text>
<text font-size="16" fill="#334155" font-weight="600"><tspan x="32" y="407">처리 후</tspan></text>
<text font-size="14" fill="#475569" font-weight="400"><tspan x="132" y="433">표시한 큐의 잔량 0</tspan></text>
<text font-size="16" fill="#0f172a" font-weight="600"><tspan x="32" y="455">내 확정 체결 20개 / 다음 가격·후순위로 넘길 틱 예산 10개</tspan></text>
<text font-size="15" fill="#475569" font-weight="400"><tspan x="32" y="480">왼쪽에서 오른쪽으로 읽습니다. 수치는 조건을 설명하는 합성 예시이며 거래 성과 예측이 아닙니다.</tspan><tspan x="32" y="504">현재 지원 상태와 세부 조건은 이 그림 아래의 본문·사례 대조표를 함께 확인하세요.</tspan></text>
</g></svg>
