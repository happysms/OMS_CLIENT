<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="396" viewBox="0 0 1040 396" role="img" aria-labelledby="title description">
<title id="title">F08 · 정정 수량이 이미 체결된 양 이하</title>
<desc id="description">부분 지원 · 설계와 현행 범위 구분。체결 누적 40개 / 새 목표 총수량 40개 이하 → 기체결량은 삭제 불가 / 요청·취소 도착 단계별 검사 → 현행: 사전 위반 거절 / 취소 후 목표 충족이면 신규 생략</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<rect width="1040" height="100%" rx="16" fill="#fff"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
<text font-size="14" fill="#64748b" font-weight="600"><tspan x="32" y="32">OMS SIMULATION  /  F08</tspan></text>
<text font-size="24" fill="#0f172a" font-weight="700"><tspan x="32" y="68">F08 · 정정 수량이 이미 체결된 양 이하</tspan></text>
<rect x="32" y="89" width="976" height="30" rx="7" fill="#fffbeb"/>
<text font-size="15" fill="#92400e" font-weight="600"><tspan x="46" y="110">부분 지원 · 설계와 현행 범위 구분</tspan></text>
<rect x="32" y="132" width="312" height="162" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="32" y="132" width="312" height="5" rx="2" fill="#92400e"/>
<text font-size="16" fill="#92400e" font-weight="700"><tspan x="52" y="167">01  상황·입력</tspan></text>
<text font-size="19" fill="#1e293b" font-weight="400"><tspan x="52" y="204">체결 누적 40개</tspan><tspan x="52" y="232">새 목표 총수량 40개 이하</tspan></text>
<path d="M347 213 L358 213" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="364" y="132" width="312" height="162" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="364" y="132" width="312" height="5" rx="2" fill="#92400e"/>
<text font-size="16" fill="#92400e" font-weight="700"><tspan x="384" y="167">02  판단·변화</tspan></text>
<text font-size="19" fill="#1e293b" font-weight="400"><tspan x="384" y="204">기체결량은 삭제 불가</tspan><tspan x="384" y="232">요청·취소 도착 단계별 검사</tspan></text>
<path d="M679 213 L690 213" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="696" y="132" width="312" height="162" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="696" y="132" width="312" height="5" rx="2" fill="#92400e"/>
<text font-size="16" fill="#92400e" font-weight="700"><tspan x="716" y="167">03  결과·보존</tspan></text>
<text font-size="19" fill="#1e293b" font-weight="400"><tspan x="716" y="204">현행: 사전 위반 거절</tspan><tspan x="716" y="232">취소 후 목표 충족이면 신규</tspan><tspan x="716" y="260">생략</tspan></text>
<text font-size="15" fill="#475569" font-weight="400"><tspan x="32" y="332">왼쪽에서 오른쪽으로 읽습니다. 수치는 조건을 설명하는 합성 예시이며 거래 성과 예측이 아닙니다.</tspan><tspan x="32" y="356">현재 지원 상태와 세부 조건은 이 그림 아래의 본문·사례 대조표를 함께 확인하세요.</tspan></text>
</g></svg>
