<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="396" viewBox="0 0 1040 396" role="img" aria-labelledby="title description">
<title id="title">체결 당시 환율로 매수 원가와 매도 대금을 따로 환산</title>
<desc id="description">현행 KRW·USDT 이중 보고。코인 1개 매수 1,000원 / 당시 1 USDT = 1,000원 / USDT 원가 = 1 → 같은 코인 매도 1,200원 / 당시 1 USDT = 1,200원 / USDT 순대금 = 1 → 비용 없는 예시 / KRW 실현손익 = +200원 / USDT 실현손익 = 0</desc>
