<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="424" viewBox="0 0 1040 424" role="img" aria-labelledby="title description">
<title id="title">가상 거래소의 실제 상태와 전략이 아는 상태</title>
<desc id="description">통지 설계 · 현재 미지원。설계: 거래소 truth / 주문 10 중 4개 체결 / 실제 position +4 · live 6 → 통지가 지연 중 / 전략 observed는 position 0 / 미체결 약정 10으로 알고 있음 → 통지 후 같은 버전으로 전환 / position 0→4 / commitment 10→6 / 합계 10은 그대로</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<rect width="1040" height="100%" rx="16" fill="#fff"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
<text font-size="14" fill="#64748b" font-weight="600"><tspan x="32" y="32">OMS SIMULATION  /  TRUTH-OBSERVED</tspan></text>
<text font-size="24" fill="#0f172a" font-weight="700"><tspan x="32" y="68">가상 거래소의 실제 상태와 전략이 아는 상태</tspan></text>
<rect x="32" y="89" width="976" height="30" rx="7" fill="#f1f5f9"/>
<text font-size="15" fill="#334155" font-weight="600"><tspan x="46" y="110">통지 설계 · 현재 미지원</tspan></text>
<rect x="32" y="132" width="312" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="32" y="132" width="312" height="5" rx="2" fill="#334155"/>
<text font-size="16" fill="#334155" font-weight="700"><tspan x="52" y="167">01  상황·입력</tspan></text>
<text font-size="19" fill="#1e293b" font-weight="400"><tspan x="52" y="204">설계: 거래소 truth</tspan><tspan x="52" y="232">주문 10 중 4개 체결</tspan><tspan x="52" y="260">실제 position +4 · live 6</tspan></text>
<path d="M347 227 L358 227" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="364" y="132" width="312" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="364" y="132" width="312" height="5" rx="2" fill="#334155"/>
<text font-size="16" fill="#334155" font-weight="700"><tspan x="384" y="167">02  판단·변화</tspan></text>
<text font-size="19" fill="#1e293b" font-weight="400"><tspan x="384" y="204">통지가 지연 중</tspan><tspan x="384" y="232">전략 observed는 position 0</tspan><tspan x="384" y="260">미체결 약정 10으로 알고 있음</tspan></text>
<path d="M679 227 L690 227" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="696" y="132" width="312" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="696" y="132" width="312" height="5" rx="2" fill="#334155"/>
<text font-size="16" fill="#334155" font-weight="700"><tspan x="716" y="167">03  결과·보존</tspan></text>
<text font-size="19" fill="#1e293b" font-weight="400"><tspan x="716" y="204">통지 후 같은 버전으로 전환</tspan><tspan x="716" y="232">position 0→4 / commitment 10</tspan><tspan x="716" y="260">→6</tspan><tspan x="716" y="288">합계 10은 그대로</tspan></text>
<text font-size="15" fill="#475569" font-weight="400"><tspan x="32" y="360">왼쪽에서 오른쪽으로 읽습니다. 수치는 조건을 설명하는 합성 예시이며 거래 성과 예측이 아닙니다.</tspan><tspan x="32" y="384">현재 지원 상태와 세부 조건은 이 그림 아래의 본문·사례 대조표를 함께 확인하세요.</tspan></text>
</g></svg>
