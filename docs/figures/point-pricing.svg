<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" role="img" aria-labelledby="title description">
<title id="title">Point 가격: 해외 기준가격과 USDT 환율에서 매수·매도 한계가로</title>
<desc id="description">원본 Point 설계 · 현재 실행 미연결。OKX 종목 microprice / × 빗썸 USDT microprice / 예: 원화 기준 base = 1,000 → 기준 −100bp · 버퍼 10bp / 가격 보정 수수료 0bp 예시 / 매수 한계 989 · 매도 한계 991 → 매수 한계 tick 내림 · 매도 tick 올림 / 현물 best와 원본 목표가 조건 결합 / 이후 잔고·주문 조건·헤지 계획 검사</desc>
