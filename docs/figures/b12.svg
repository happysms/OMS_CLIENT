<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="368" viewBox="0 0 1040 368" role="img" aria-labelledby="title description">
<title id="title">B12 · 전송→도착 사이 호가 개선·악화·소멸</title>
<desc id="description">명시적 모형 가정。전송 시 ask 100원 / 도착 전 ask가 102원으로 변경 → 매수 limit 101 / 도착 당시 호가로 다시 검사 → 전송 당시 100원 fill 금지 / 도착 조건에 따라 대기·취소</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<rect width="1040" height="100%" rx="16" fill="#fff"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
<text font-size="14" fill="#64748b" font-weight="600"><tspan x="32" y="32">OMS SIMULATION  /  B12</tspan></text>
<text font-size="24" fill="#0f172a" font-weight="700"><tspan x="32" y="68">B12 · 전송→도착 사이 호가 개선·악화·소멸</tspan></text>
<rect x="32" y="89" width="976" height="30" rx="7" fill="#eff6ff"/>
<text font-size="15" fill="#1d4ed8" font-weight="600"><tspan x="46" y="110">명시적 모형 가정</tspan></text>
<rect x="32" y="132" width="312" height="134" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="32" y="132" width="312" height="5" rx="2" fill="#1d4ed8"/>
<text font-size="16" fill="#1d4ed8" font-weight="700"><tspan x="52" y="167">01  상황·입력</tspan></text>
<text font-size="19" fill="#1e293b" font-weight="400"><tspan x="52" y="204">전송 시 ask 100원</tspan><tspan x="52" y="232">도착 전 ask가 102원으로 변경</tspan></text>
<path d="M347 199 L358 199" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="364" y="132" width="312" height="134" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="364" y="132" width="312" height="5" rx="2" fill="#1d4ed8"/>
<text font-size="16" fill="#1d4ed8" font-weight="700"><tspan x="384" y="167">02  판단·변화</tspan></text>
<text font-size="19" fill="#1e293b" font-weight="400"><tspan x="384" y="204">매수 limit 101</tspan><tspan x="384" y="232">도착 당시 호가로 다시 검사</tspan></text>
<path d="M679 199 L690 199" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="696" y="132" width="312" height="134" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<rect x="696" y="132" width="312" height="5" rx="2" fill="#1d4ed8"/>
<text font-size="16" fill="#1d4ed8" font-weight="700"><tspan x="716" y="167">03  결과·보존</tspan></text>
<text font-size="19" fill="#1e293b" font-weight="400"><tspan x="716" y="204">전송 당시 100원 fill 금지</tspan><tspan x="716" y="232">도착 조건에 따라 대기·취소</tspan></text>
<text font-size="15" fill="#475569" font-weight="400"><tspan x="32" y="304">왼쪽에서 오른쪽으로 읽습니다. 수치는 조건을 설명하는 합성 예시이며 거래 성과 예측이 아닙니다.</tspan><tspan x="32" y="328">현재 지원 상태와 세부 조건은 이 그림 아래의 본문·사례 대조표를 함께 확인하세요.</tspan></text>
</g></svg>
