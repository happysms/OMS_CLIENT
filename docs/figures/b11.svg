<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="368" viewBox="0 0 1040 368" role="img" aria-labelledby="title description">
<title id="title">B11 · raw best는 교차하나 self/public 소진 부채로 유효량 0</title>
<desc id="description">명시적 모형 가정。raw ask 100원 × 4개 / 앞선 내 주문이 4개 소비 → 가용량 = raw − 소진 부채 / 다음 주문에는 0개 → 같은 4개 재사용 금지 / Post-only 교차 검사는 별도</desc>
