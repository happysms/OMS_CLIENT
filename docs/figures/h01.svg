<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="368" viewBox="0 0 1040 368" role="img" aria-labelledby="title description">
<title id="title">H01 · 지정가 체결이 기존 포지션과 같은 방향</title>
<desc id="description">설계 제안 · 현재 실행 미지원。설계: 선물 롱 2개 @100 / 같은 방향 매수 1개 @110 → 포지션 2 + 1 = 3 / 가중 진입가 310 / 3 → 롱 3개 · 평균 약 103.33 / 예시는 승수 1·수수료 제외</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<rect width="1040" height="100%" rx="16" fill="#fff"/>
<g font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
<text font-size="14" fill="#64748b" font-weight="600"><tspan x="32" y="32">OMS SIMULATION  /  H01</tspan></text>
<text font-size="24" fill="#0f172a" font-weight="700"><tspan x="32" y="68">H01 · 지정가 체결이 기존 포지션과 같은 방향</tspan></text>
<rect x="32" y="89" width="976" height="30" rx="7" fill="#faf5ff"/>
<text font-size="15" fill="#6b21a8" font-weight="600"><tspan x="46" y="110">설계 제안 · 현재 실행 미지원</tspan></text>
<rect x="32" y="132" width="312" height="134" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>
<rect x="32" y="132" width="312" height="5" rx="2" fill="#6b21a8"/>
<text font-size="16" fill="#6b21a8" font-weight="700"><tspan x="52" y="167">01  상황·입력</tspan></text>
<text font-size="19" fill="#1e293b" font-weight="400"><tspan x="52" y="204">설계: 선물 롱 2개 @100</tspan><tspan x="52" y="232">같은 방향 매수 1개 @110</tspan></text>
<path d="M347 199 L358 199" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<rect x="364" y="132" width="312" height="134" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>
<rect x="364" y="132" width="312" height="5" rx="2" fill="#6b21a8"/>
<text font-size="16" fill="#6b21a8" font-weight="700"><tspan x="384" y="167">02  판단·변화</tspan></text>
<text font-size="19" fill="#1e293b" font-weight="400"><tspan x="384" y="204">포지션 2 + 1 = 3</tspan><tspan x="384" y="232">가중 진입가 310 / 3</tspan></text>
<path d="M679 199 L690 199" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<rect x="696" y="132" width="312" height="134" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>
<rect x="696" y="132" width="312" height="5" rx="2" fill="#6b21a8"/>
<text font-size="16" fill="#6b21a8" font-weight="700"><tspan x="716" y="167">03  결과·보존</tspan></text>
<text font-size="19" fill="#1e293b" font-weight="400"><tspan x="716" y="204">롱 3개 · 평균 약 103.33</tspan><tspan x="716" y="232">예시는 승수 1·수수료 제외</tspan></text>
<text font-size="15" fill="#475569" font-weight="400"><tspan x="32" y="304">왼쪽에서 오른쪽으로 읽습니다. 수치는 조건을 설명하는 합성 예시이며 거래 성과 예측이 아닙니다.</tspan><tspan x="32" y="328">현재 지원 상태와 세부 조건은 이 그림 아래의 본문·사례 대조표를 함께 확인하세요.</tspan></text>
</g></svg>
